name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: azure-static-web-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    name: Build and Deploy

    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.action != 'closed')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_MUD_08EFB760F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload

          # A raiz contém os arquivos prontos para publicação.
          app_location: "/"

          # Não existe uma Azure Functions API.
          api_location: ""

          # Não existe pasta gerada por build.
          output_location: ""

          # Desativa o Oryx e não executa npm run build.
          skip_app_build: true

  close_pull_request_job:
    name: Close Pull Request Environment

    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'

    runs-on: ubuntu-latest

    steps:
      - name: Close Azure Static Web Apps environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_MUD_08EFB760F }}
          action: close
